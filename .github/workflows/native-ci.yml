name: Native CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Validate repository
        run: python Scripts/validate_repo.py

      - name: Configure native tests
        run: cmake -S Tests/Native -B build/native -DCMAKE_BUILD_TYPE=Release

      - name: Build native tests
        run: cmake --build build/native --config Release --parallel

      - name: Run native tests
        run: ctest --test-dir build/native -C Release --output-on-failure
