name: Publish Wiki

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Wiki/**"
      - ".github/workflows/publish-wiki.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Publish Wiki directory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          wiki_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          rm -rf /tmp/project-wiki
          if ! git clone "$wiki_url" /tmp/project-wiki; then
            echo "The GitHub Wiki repository does not exist yet."
            echo "Create the first Wiki page in GitHub once, then rerun this workflow."
            exit 1
          fi
          find /tmp/project-wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a Wiki/. /tmp/project-wiki/
          cd /tmp/project-wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi
          git commit -m "docs: sync wiki from main"
          git push origin HEAD:master
