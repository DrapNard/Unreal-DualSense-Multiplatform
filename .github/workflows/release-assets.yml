name: Release Assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  source-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag with dependency
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          submodules: true

      - name: Create self-contained plugin archive
        shell: bash
        run: |
          set -euo pipefail
          archive="DualSenseMultiplatform-${{ github.event.release.tag_name }}.zip"
          staging="$RUNNER_TEMP/release/DualSenseMultiplatform"
          mkdir -p "$staging"
          rsync -a \
            --exclude='.git' \
            --exclude='build' \
            --exclude='dist' \
            --exclude='Binaries' \
            --exclude='Intermediate' \
            ./ "$staging/"
          (cd "$(dirname "$staging")" && zip -qr "$GITHUB_WORKSPACE/$archive" DualSenseMultiplatform)
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Verify submodule source is packaged
        shell: bash
        run: |
          unzip -l "$ARCHIVE" | grep -q 'DualSenseMultiplatform/ThirdParty/Dualsense-Multiplatform/Source/Public/GCore/Interfaces/IPlatformHardware.h'

      - name: Attach plugin archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$ARCHIVE" --clobber
