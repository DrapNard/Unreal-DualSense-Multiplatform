version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily
    target-branch: main
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - upstream
    commit-message:
      prefix: "chore(deps)"
